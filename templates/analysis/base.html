<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>データ分析アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .navbar {
            background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            padding: 1rem 0;
        }
        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .btn-nav {
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            border-radius: 20px;
            padding: 0.3rem 1rem;
            margin-left: 0.5rem;
            transition: all 0.3s;
        }
        .btn-nav:hover {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card-header {
            border-radius: 16px 16px 0 0 !important;
            padding: 1rem 1.5rem;
            font-weight: 600;
        }
        .card-header.gradient-header {
            background: linear-gradient(90deg, #1a1a2e 0%, #0f3460 100%);
            color: white;
        }
        .card-header.gradient-secondary {
            background: linear-gradient(90deg, #457b9d 0%, #1d3557 100%);
            color: white;
        }
        .btn-primary-custom {
            background: linear-gradient(90deg, #1a1a2e 0%, #0f3460 100%);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            opacity: 0.85;
            transform: translateY(-1px);
            color: white;
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid #dee2e6;
            padding: 0.6rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 3px rgba(15,52,96,0.15);
            border-color: #0f3460;
        }
        .table th {
            color: #1d3557;
            font-weight: 600;
        }
        .badge-stat {
            background: linear-gradient(90deg, #457b9d, #1d3557);
            color: white;
            border-radius: 8px;
            padding: 0.3rem 0.8rem;
            font-size: 0.85rem;
        }
        .container {
            padding-top: 2rem;
            padding-bottom: 3rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'upload' %}">📊 DataAnalytics</a>
            <div>
                <a class="btn-nav" href="{% url 'upload' %}">📂 CSVアップロード</a>
                <a class="btn-nav" href="{% url 'kaggle_import' %}">🔗 Kaggle取得</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
